name: Compilar

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Compilar para o simulador
        run: |
          xcodebuild build \
            -project Vida.xcodeproj \
            -scheme Vida \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      # Abre o app no simulador com dados de exemplo e tira fotos das telas,
      # para dar para ver o app sem precisar de um Mac.
      - name: Capturas de tela
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          for runtime in runtimes:
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
              phones = phones or [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Vida.app
          mkdir -p capturas
          for tela in hoje remedios detalhe novo; do
            xcrun simctl launch --terminate-running-process "$UDID" com.mafepietro.vida -demo -tela "$tela"
            sleep 6
            xcrun simctl io "$UDID" screenshot "capturas/$tela.png"
          done
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch --terminate-running-process "$UDID" com.mafepietro.vida -demo -tela hoje
          sleep 6
          xcrun simctl io "$UDID" screenshot "capturas/hoje-escuro.png"
          ls -la capturas

      - name: Guardar capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: capturas

      # Também salva as fotos num ramo separado ("capturas"), fácil de abrir pelo GitHub.
      - name: Publicar capturas no ramo "capturas"
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp -r capturas /tmp/capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan capturas-tmp
          git rm -rf --quiet .
          rm -rf ./* .github build
          cp /tmp/capturas/*.png .
          git add *.png
          git commit -m "Capturas de tela de ${GITHUB_HEAD_REF} (${GITHUB_SHA::7})"
          git push --force origin HEAD:capturas
