name: Compilar

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Xcode
        run: xcodebuild -version
      - name: Compilar para o simulador
        run: |
          xcodebuild build \
            -project Vida.xcodeproj \
            -scheme Vida \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
